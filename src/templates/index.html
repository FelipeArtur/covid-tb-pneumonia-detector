<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-Ray Analysis Tool</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <nav>
            <div class="logo">X-Ray Analyzer</div>
            <ul>
                <li><a href="/" class="active">Single Analysis</a></li>
                <li><a href="/batch">Batch Processing</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <section class="upload-section">
                <h1>Chest X-Ray Analysis</h1>
                <p>Upload a chest X-ray image for analysis of COVID-19, Tuberculosis, or Pneumonia</p>
                
                <div class="gradcam-toggle">
                    <label class="switch">
                        <input type="checkbox" id="gradcamToggle">
                        <span class="slider round"></span>
                    </label>
                    <span>Show Grad-CAM visualization</span>
                </div>

                <div class="upload-area" id="dropZone">
                    <input type="file" id="fileInput" accept=".jpg,.jpeg,.png" hidden>
                    <div class="upload-content">
                        <img src="{{ url_for('static', filename='img/upload-icon.svg') }}" alt="Upload">
                        <p>Drag and drop your X-ray image here<br>or <span class="highlight">click to browse</span></p>
                    </div>
                </div>
            </section>

            <section class="results-section" style="display: none;">
                <div class="results-container">
                    <div class="image-container">
                        <div class="image-preview">
                            <img id="previewImage" src="" alt="X-ray preview">
                        </div>
                        <div class="gradcam-preview" style="display: none;">
                            <img id="gradcamImage" src="" alt="Grad-CAM visualization">
                        </div>
                    </div>
                    <div class="prediction-results">
                        <h2>Analysis Results</h2>
                        <div class="prediction-bars"></div>
                        <div class="prediction-summary">
                            <p class="diagnosis"></p>
                            <p class="confidence"></p>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 X-Ray Analysis Tool</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
